<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intelligence That Grows With You</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://db.onlinewebfonts.com/c/8cb707a9b8a73f8a7403336b861c3074?family=BubbledotICG-FinePos"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="styles.css?v=2"
  />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <video class="bg-video" autoplay muted loop playsinline>
      <source
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260809_012548_ef22562c-c0ae-4816-ad9d-f8922af4e6a7.mp4"
        type="video/mp4"
      />
    </video>
  </div>

  <div class="page">
    <header class="header">
      <a class="logo" href="#" aria-label="Home">
        <img src="assets/logo.webp" alt="" width="52" height="52" />
      </a>

      <nav class="nav-pill" aria-label="Primary">
        <a class="nav-link active" href="index.html">Home</a>
        <a class="nav-link" href="product.html">Product</a>
        <a class="nav-link" href="profile.html">Profile</a>
        <a class="nav-link" href="contact.html">Contact</a>
      </nav>

      <button
        class="burger"
        type="button"
        aria-label="Menu"
        aria-expanded="false"
        aria-controls="mobile-menu"
      >
        <span></span><span></span><span></span>
      </button>
    </header>

    <main class="hero">
      <h1 class="headline">
        <span class="line">Intelligence</span>
        <span class="line">That Grows With You</span>
      </h1>

      <p class="subhead anim" style="--d: 0.28s">
        Reason, adapt and evolve with every interaction.
      </p>

      <a class="cta anim anim-pulse" href="product.html" style="--d: 0.4s">
        Get Started
      </a>
    </main>

    <footer class="stats" aria-label="Project statistics">
      <div class="stat anim" style="--d: 0.5s">
        <span class="stat-icon">&lt;</span>
        <span class="stat-value" data-target="9529" data-decimals="0" data-suffix="">0</span>
        <span class="stat-label">Lines of Code</span>
      </div>
      <div class="stat anim" style="--d: 0.58s">
        <span class="stat-icon">%</span>
        <span class="stat-value" data-target="100" data-decimals="0" data-suffix="%">0%</span>
        <span class="stat-label">Built With AI</span>
      </div>
      <div class="stat anim" style="--d: 0.66s">
        <span class="stat-icon">*</span>
        <span class="stat-value" data-target="3" data-decimals="0" data-suffix="">0</span>
        <span class="stat-label">Days to Ship</span>
      </div>
      <div class="stat anim" style="--d: 0.74s">
        <span class="stat-icon">#</span>
        <span class="stat-value" data-target="18" data-decimals="0" data-suffix="">0</span>
        <span class="stat-label">Feature Modules</span>
      </div>
    </footer>
  </div>

  <div class="menu-overlay" hidden></div>
  <div class="menu-sheet" id="mobile-menu" hidden>
    <a class="menu-link active" href="index.html">Home</a>
    <a class="menu-link" href="product.html">Product</a>
    <a class="menu-link" href="profile.html">Profile</a>
    <a class="menu-link" href="contact.html">Contact</a>
  </div>

  <script src="main.js?v=2" defer></script>
</body>
</html>
